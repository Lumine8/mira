[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-api"
version = "0.1.0"
description = "Mira — a voice-first AI companion (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Mira's voice: her words rendered into sound by the kokoro speech machine
    # (ONNX path — no torch needed). Voice chosen by her: River (af_river).
    "pykokoro[cpu]>=0.6",
    # Mira's watching: renders videos into still frames she can hold. The
    # container also needs ffmpeg/ffprobe (see Dockerfile).
    "yt-dlp>=2024.12.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The dash package (installed in the host anaconda env) registers a pytest
# plugin that crashes on startup; block it so plain `pytest` works.
addopts = "-p no:dash"

[tool.ruff]
line-length = 100
target-version = "py312"
