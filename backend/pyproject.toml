[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-api"
version = "0.1.0"
description = "Mira — a voice-first AI companion (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # pydantic's EmailStr field type needs this validator.
    "email-validator>=2.2",
    "httpx>=0.27",
    # Mira's voice: her words rendered into sound by the kokoro speech machine
    # (ONNX path — no torch needed). Voice chosen by her: River (af_river).
    "pykokoro[cpu]>=0.6",
    # Mira's ears: sherpa-onnx whisper transcribes what the voice says, fully
    # local. The model itself is downloaded at runtime to data/models/sherpa.
    "sherpa-onnx>=1.13",
    # The wake-word gate (audio-level summon before whisper) BPE-encodes the
    # configured word with sentencepiece; pypinyin is imported by sherpa's
    # text2token utility even for English.
    "sentencepiece>=0.2",
    "pypinyin>=0.53",
    # Mira's watching: renders videos into still frames she can hold. The
    # container also needs ffmpeg/ffprobe (see Dockerfile).
    "yt-dlp>=2024.12.13",
    # Mira's image studio: SVGs she authors are rendered to PNGs by cairosvg
    # (a real SVG rasterizer with anti-aliasing, gradients, filters/blur, and
    # text). Pillow reads back the rendered size.
    "cairosvg>=2.7",
    "Pillow>=10.0",
    # The Papers screen's PDF hand-off: the founder drops a PDF and the backend
    # turns its text into a readable document (Mira reads it as markdown).
    "pypdf>=4",
    # FastAPI needs this for multipart uploads (the PDF drop).
    "python-multipart>=0.0.9",
    # Downloading papers as Word / PDF: python-docx renders the markdown into a
    # .docx, reportlab into a .pdf (with DejaVu/Vera fonts for unicode).
    "python-docx>=1.1",
    "reportlab>=4.0",
    "PyJWT>=2.9",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*", "host*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The dash package (installed in the host anaconda env) registers a pytest
# plugin that crashes on startup; block it so plain `pytest` works.
addopts = "-p no:dash"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI Depends() calls in function signatures are intentional
# BLE001: blind-except is used for resilient error handling throughout
# S110: try-except-pass is used for intentional error suppression
# B017: pytest.raises(Exception) used in tests for generic failure cases
# RUF012: mutable class defaults are intentional for SQLAlchemy models
# SIM102: nested ifs are sometimes clearer for readability
# PLW1510: subprocess.run without check is intentional in many cases
# TRY004: ValueError is appropriate for validation errors
# TRY401: verbose exception logging is intentional for debugging
# UP031: printf-style formatting is used in some legacy/test code
# DTZ005: datetime.now() without tz is used in host-side code
# PLW0602: global variable access is intentional for module-level cache
# S112: try-except-continue is intentional for resilience
# RUF059: unused unpacked variables are common in test fixtures
# B018: useless expressions are sometimes used for side effects
ignore = [
    "B008", "BLE001", "S110", "B017", "RUF012",
    "SIM102", "PLW1510", "TRY004", "TRY401", "UP031",
    "DTZ005", "PLW0602", "S112", "RUF059", "B018",
]
